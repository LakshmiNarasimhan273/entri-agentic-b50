<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h2>Forms Tag</h2>

    <!-- structured section -->
    <form>
        <label>Name</label>
       <input type="text" placeholder="Enter your name" required><br><br>

       <!-- lakshminarasimhan@gmail.com -->
        <!-- someone@gmail.com -->
         <!-- alex@gmail.com -->

       <label for="">Email</label>
       <input type="email" placeholder="Enter your Email" required><br><br>

       <label for="">Password</label>
       <input type="password" placeholder="Enter your Password" required><br><br>

       <label for="">Age</label>
       <input required type="number" placeholder="Enter your Age"> <br><br>

       <label for="">Mobile Number</label>
       <input required type="tel"><br><br>

       <label for="">DOB</label>
       <input required type="date"><br><br>

       <label for="">Preferred Time</label>
       <input required type="time"><br><br>

       <label for="">Upload your Resume</label>
       <input required type="file"><br><br>

       <label for="">Gender</label>
       <input name="gender" type="radio" required>Female
       <input name="gender" type="radio">Male
       <input name="gender" type="radio">Not Specified
       <br><br>

       <label for="">Select your Course</label>
       <select required name="" id="">
        <option value="">--</option>
        <option value="">FSD</option>
        <option value="">DA</option>
        <option value="">DS</option>
       </select><br><br>

       <input required type="checkbox">
       <label for="">Terms & Conditions</label><br><br>

       <button type="submit">Submit Form</button>
    </form>

</body>
</html>
