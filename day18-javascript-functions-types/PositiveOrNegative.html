<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function checkPositiveOrNegative()
        {
        var num=parseInt(prompt("enter the number"));
        if(num>0)
        {
            return "positive"
        }
        else if(num<0)
        {
            return "negative"
        }
        else{
            return "neutral"
        }
        }
        document.write(checkPositiveOrNegative());
    </script>
</body>
</html>
